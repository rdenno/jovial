# Builds the APK on every push. Pushing a v* tag (or a manual run with a release tag) publishes
# a release-signed APK as a GitHub release; other runs upload the APK as a workflow artifact.
name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (e.g. v1.4.0) from the selected branch; leave empty to only build"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.JOVIAL_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ -n "$RELEASE_TAG" ]; then
              echo "::error::JOVIAL_KEYSTORE_BASE64 secret is not set; refusing to publish a debug-signed APK"
              exit 1
            fi
            echo "::warning::No release keystore secret; building with a throwaway debug key"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "JOVIAL_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          JOVIAL_KEYSTORE_PASSWORD: ${{ secrets.JOVIAL_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk jovial.apk

      - uses: actions/upload-artifact@v4
        with:
          name: jovial-apk
          path: jovial.apk

      - name: Publish GitHub release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        # --target creates the tag at the built commit when it does not exist yet
        run: gh release create "$RELEASE_TAG" jovial.apk --target "$GITHUB_SHA" --title "Jovial $RELEASE_TAG" --notes-file .github/release-notes.md
